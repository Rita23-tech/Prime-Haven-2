<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>
    <link rel="stylesheet" href="Css/registration.css">
</head>
<body>
    <form action=""> 

        <legend>Join us and start your journey with us</legend>
        <br>

        <label for="fname">Input FirstName:</label>
        <input type="text" id="fname" placeholder="Eg Brian" required>
        <br><br>

        <label for="Sname">Input Surname:</label>
        <input type="text" id="Sname" placeholder="Eg Smith" required>
        <br><br>

        <label for="Email">Input Email address:</label>
        <input type="email" id="Email" placeholder="Eg brian@example.com" required>
        <br><br>

        <label for="password">Input Password:</label>
        <input type="password" id="password" placeholder="Enter your password" required>
        <br><br>

        <label for="height">Input Height:</label>
        <input type="number" id="height" placeholder="Eg 5 inches" required>
        <br><br>

        <label for="yob">Input Year of Birth:</label>
        <input type="date" id="yob" required>
        <br><br>

        <label for="DT">Date and Time:</label>
        <input type="datetime-local" id="DT" required>
        <br><br>

        <label for="image">Upload Image:</label>
        <input type="file" id="image" required>
        <br><br>
        <!---drop down--->
        <label for="nationality">Select your Nationality:</label>
        <select name="nationality" id="nationality" required>
            <option value="" disabled>-- Please select --</option>
            <option value="KE">Kenya</option>
            <option value="UG">Uganda</option>
            <option value="TZ">Tanzania</option>
            <option value="CA" disabled>Canada</option>
            <!-- Add more options as needed -->
        </select>
        <!---end of drop down--->
        <br><br>
        <!---radio buttons (if answer you want to be picked is just one)--->
        <label for="football">Choose your favourite football team:</label> <br>        
        <input type="radio" id="ManU" name="football"> <!---assigning same attribut name, to enable user to select ony one option--->
        <label for="ManU">Manchester United</label>
        <br>

        <input type="radio" id="Arsenal" name="football">
        <label for="Arsenal">Arsenal</label>
        <br>

        <input type="radio" id="Chelsea" name="football">
        <label for="Chelsea">Chelsea</label>
        <br>

        <br>
        <!---Checkboxes--->
        <label for="language">Select Language:</label>
        <br>

        <input type="checkbox" id="French" name="French">
        <label for="French">French</label>
        <br>

        <input type="checkbox" id="German" name="German">
        <label for="German">German</label>
        <br>

        <input type="checkbox" id="Swahili" name="Swahili">
        <label for="Swahili">Swahili</label>
        <br>

        <input type="checkbox" id="English" name="English">
        <label for="English">English</label>
        <br>
        <br>

        <label for="message">Message:</label> 
        <br>
        <textarea name="" id="" cols="50" rows="25"></textarea>
        <br><br>

        <button type="submit">Register</button>
        











    </form>
















<br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>  
</body>
</html>

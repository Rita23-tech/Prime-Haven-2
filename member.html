<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member form</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="Bootstrap/css/bootstrap.min.css">

    <!-- Bootstrap JS -->
    <script src="Bootstrap/js/bootstrap.min.js"></script>
</head>
<body>
    <h1>New member registration</h1>

    <form action="" class="bg-success-subtle m-5 p-5 ">
        <div class="mb-4">
            <label for="fname" class="form-label">Full Name</label>
            <input type="text" id="fname" class="form-control" placeholder="e.g Rita Monchari" required>
        </div>

        <div class="mb-4">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" id="email" class="form-control" placeholder="e.g abcde@gmail.com" required>
        </div>

        <div class="mb-4">
            <label for="address" class="form-label" >Input yor Address</label>
            <input type="text" id="address" class="form-control" placeholder="Nairobi-Ken" required>
        </div>

        <div class="mb-4">
            <label for="Phone number" class="form-label" >Input your phone number</label>
            <input type="tel" id="Phone number" class="form-control" placeholder="+25411223344" required>
        </div>

        <div>
            <button type="submit" class="btn btn-outline-info">Submit</button>
        </div>



    </form>









</body>
</html>
